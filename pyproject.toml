[project]
name = "claude-code-log"
version = "1.5.0"
description = "Convert Claude Code transcript JSONL files to HTML"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Daniel Demmel", email = "hello@danieldemmel.me" },
    { name = "Edward Z. Yang", email = "ezyang@mit.edu" },
]

dependencies = [
    "click>=8.3.0",
    "dateparser>=1.2.2",
    "pydantic>=2.12.0",
    "jinja2>=3.1.6",
    "mistune>=3.1.4",
    "toml>=0.10.2",
    "textual>=6.5.0",
    "packaging>=25.0",
    "gitpython>=3.1.45",
    "pygments>=2.19.2",
    "tree-sitter>=0.26.0,<0.27.0",
    "tree-sitter-javascript>=0.25.0,<0.26.0",
]

[project.urls]
Homepage = "https://github.com/daaain/claude-code-log"
Issues = "https://github.com/daaain/claude-code-log/issues"

[project.scripts]
claude-code-log = "claude_code_log.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_code_log"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-n auto --dist=worksteal"
markers = [
    "tui: TUI tests using Textual framework (requires isolated event loop)",
    "browser: Browser integration tests using Playwright (requires Chromium)",
    "snapshot: Snapshot tests that must run serially (syrupy file ordering)",
    "integration: Integration tests with realistic JSONL data",
    "slow: Slower tests that measure performance (may take several seconds)",
    "benchmark: Performance benchmarks that output to GitHub Job Summary",
]

[tool.ty.environment]
extra-paths = ["stubs"]
python-platform = "all"

[tool.ty.src]
exclude = ["docs"]

[tool.pyright]
include = ["claude_code_log"]
exclude = ["**/__pycache__", "dist"]
stubPath = "stubs"
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = true
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "strict"
reportUnknownMemberType = true
reportUnknownParameterType = true
reportUnknownVariableType = true
reportUnknownArgumentType = true
reportPrivateImportUsage = true
reportUntypedFunctionDecorator = true
reportFunctionMemberAccess = true
reportIncompatibleMethodOverride = true

[tool.ruff]
target-version = "py310"

[tool.coverage.run]
source = ["claude_code_log"]
omit = ["*/tests/*", "*/test/*", "*/__pycache__/*", "*/venv/*", "*/.venv/*"]
relative_files = true
core = "sysmon"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=5.0.0",
    "coverage[toml]>=7.9",
    "ruff>=0.11.2",
    "pytest-xdist[psutil]>=3.6.1",
    "pyright>=1.1.408",
    "vulture>=2.14",
    "ty>=0.0.11",
    "pytest-playwright>=0.7.0",
    "syrupy>=5.0.0",
    "claude-code-log-clmail-test",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocs-click>=0.8.1",
    "mkdocs-gen-files>=0.5.0",
]

[tool.uv.sources]
claude-code-log-clmail-test = { path = "test/_plugins/clmail", editable = true }