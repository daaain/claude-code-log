# foldyard config — claude-code-log
# Generated by `foldyard init`. This starts as a LOCKED-DOWN, stack-less dev box you can
# safely build and poke — then you GROW it by uncommenting, in this order:
#   1. `fy box up` then `fy box shell` — a rootless Lima VM, egress WALLED to a Mac
#      allowlisting proxy, ONLY this repo mounted, no push credential. `fy verify` proves
#      the cage. Poke around; nothing you do escapes it.
#   2. Uncomment ONE agent ([claude] or [codex]) + `fy box up` again — now an AI agent
#      runs INSIDE the safe sandbox. Use it to work out the rest of this config with you.
#   3. Uncomment a stack + the features at the bottom as the project needs them.
# Resolution everywhere: explicit env var wins → foldyard.local.toml (gitignored,
# per-developer overrides) → this file → built-in default.

[project]
name = "claude-code-log"
# Container/volume/network name prefix (a worktree appends `-<name>`).
prefix = "claude-code-log"
# A compose stack to drive alongside the box — uncomment when you have one (step 3), and
# add its host ports under [ports] below.
#   app = "app"                # the app service (fy shell target)
#   app_port = "WEB_PORT"      # [ports] key shown in the TUI + opened by `fy open`
#   compose = ["compose.yml"]  # compose files in -f order, relative to this dir

[machine]
# A rootless VM that mounts ONLY this repo. Default here is the Lima backend + an in-VM
# egress WALL: fail-closed, so the box's only way out is the Mac's allowlisting proxy
# (below). Sizing applies at FIRST creation; to resize later: `foldyard machine recreate`.
#   backend = "podman"  # the single shared podman machine — no concurrent per-project
#                       # VMs, and no in-VM wall (egress is the Mac-side proxy + gvproxy)
#   backend = "native"  # host podman directly (no VM) — weakest isolation, shared kernel
#   wall = false        # lima but COOPERATIVE-only: the box uses the proxy, but nothing
#                       # stops a process that ignores it (the wall makes it fail-closed)
backend = "lima"
wall = true
name = "claude-code-log"
cpus = 4
memory_mib = 8192   # MiB — any whole number
disk_gib = 60

# Egress proxy. Declaring [proxy] routes the box's egress through the Mac proxy — REQUIRED
# by the wall (which otherwise leaves the box with no way out). Allow-all at first so box
# bootstrap (PyPI, etc.) just works; lock down once you know your egress by flipping
# `default_deny` and curating `allow` — blocked hosts then show live in `fy tui`, where you
# can grant them. Any keyless host (below) is ALWAYS allowed implicitly — never list it.
[proxy]
default_deny = false
# allow = ["github.com", "pypi.org", "*.pypi.org", "files.pythonhosted.org"]
# The [[box.tools]] steps below also need "*.fedoraproject.org" (dnf metalink + whichever
# mirror it redirects to) for their dnf installs, and "cdn.playwright.dev" (browser bundles).
# passthrough = ["@all"]   # hosts tunnelled UN-decrypted under default_deny (the toolchain)

# ── Agents — uncomment ONE, then `fy box up` (step 2) ────────────────────────────────────
# Claude Code (`fy claude`). Declaring [claude] installs it on box-up + mounts its persisted
# login/transcripts. Keyless: the real token is injected at the Mac proxy, NEVER in the box
# (`fy box up` prompts once, hidden; stored only on the Mac). Then `fy mode claude=on`.
[claude]
keyless = "oauth"      # Bearer on api.anthropic.com ← `claude setup-token` on the Mac
system_prompt = """
You are root in this project's locked-down foldyard dev box: a rootless Lima VM with an
in-VM egress wall, so your only way out is the Mac's allowlisting proxy. Prove the cage
with `fy verify`. You can read + commit locally but CANNOT push, and hold no real
credentials. Drive the stack with `fy` (up | ps | logs | shell | down | verify). Edit in
foldyard.toml.
"""
#
# OpenAI Codex CLI (`fy codex`). Declaring [codex] installs it on box-up + mounts ~/.codex.
# Needs node in the box. Keyless like Claude — the proxy injects host-side.
# [codex]
# keyless = "api-key"    # Authorization: Bearer ← OPENAI_API_KEY (captured to host.env)
# # keyless = "chatgpt"  # your ChatGPT subscription: the minter refreshes ~/.codex/auth.json

# ── The rest — uncomment as you grow (step 3) ────────────────────────────────────────────
# Host-published ports, keyed by the env var your compose file reads. In-container ports
# never move, so a second worktree's stack gets offset host ports and never collides.
# [ports]
# APP_PORT = 3000
#
# Your OWN toolchain image instead of foldyard's packaged generic box (engine client + git
# + uv). Point it at a Dockerfile; foldyard injects the socket/CLI/proxy-CA at box-up.
#   image = { dockerfile = "box.Dockerfile", tag = "claude-code-log-box:latest" }
[box]
# Shared named volumes mounted into the box at a $HOME-relative path, so they survive box
# recreation. Playwright's browser bundle is ~900 MB — without this, every fresh box
# re-downloads it through the proxy.
caches = [{ volume = "devbox_playwright", path = ".cache/ms-playwright" }]

# Consumer tools installed once per fresh box, as MONITORED steps (reported ✓/✗). They run
# as root, in the checkout, before the deps warm-up.
#
# `just` is this project's documented entry point: CLAUDE.md and CONTRIBUTING.md route every
# workflow through it (`just ci` before pushing, `just test`, `just docs-build`), so without
# it the box can't follow its own instructions — and the recipes below name it too. Fedora
# packages it in `updates` (1.57.0 on F44), so this is a plain dnf install: no COPR, no cargo
# build, no prebuilt binary fetched past the proxy. It pulls fzf in as a dependency (just's
# `--choose`); the check names only what we asked for.
[[box.tools]]
name = "just"
check = "rpm -q just"
install = "dnf install -y just"

# Browser tests (`just test-browser`, `uv run pytest -m browser`) need Chromium's shared
# libraries in the box. `playwright install --with-deps` CANNOT do this here: it only knows
# apt (Ubuntu/Debian) and the box image is Fedora, so the system libs are an explicit dnf
# step. The list below is the empirically-verified minimum for headless Chromium on
# fedora-toolbox aarch64 — libatomic is a separate line because the headless_shell binary
# needs it and it isn't pulled in by any of the others.
[[box.tools]]
name = "chromium-system-libs"
check = "rpm -q nss atk at-spi2-atk libXcomposite libXrandr mesa-libgbm libatomic"
install = "dnf install -y libX11 libXcomposite libXdamage libXext libXfixes libXrandr alsa-lib atk at-spi2-atk at-spi2-core dbus-libs mesa-libgbm nspr nss nss-util libxcb cups-libs pango cairo libdrm libatomic"

# Browser binaries, from the version of playwright uv.lock pins (NOT a floating `uvx
# playwright` — the browser build number is tied to the library version). `--frozen` keeps
# uv from rewriting the lockfile on the host bind mount, and the sync it does here doubles
# as the venv warm-up. `check = "false"` means always run: `playwright install` is idempotent
# and cheap once the cache volume above is warm, and re-running is what picks up a new
# browser build when the playwright pin moves. It prints "your OS is not officially
# supported … downloading fallback build for ubuntu20.04" on Fedora — expected, and that
# fallback build is the one the suite passes on.
[[box.tools]]
name = "playwright-chromium"
check = "false"
install = "uv run --frozen playwright install chromium"

# VS Code attach (`fy code`) — persist the vscode-server volume across box recreations.
[vscode]
