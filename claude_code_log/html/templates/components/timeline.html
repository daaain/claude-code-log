<!-- Timeline Component Template -->
<!-- vis-timeline integration for transcript visualization -->

<div id="timeline-container"
    style="display: none; position: sticky; top: 0; z-index: 100; width: 100vw; margin-left: calc(-50vw + 50%); overflow: hidden; min-height: 150px; max-height: 80vh;">
    <div id="timeline-visualization" style="height: calc(100% - 8px); width: 100%;"></div>
    <div id="timeline-resize-handle"
        style="position: absolute; bottom: 0; left: 0; right: 0; height: 8px; cursor: ns-resize; display: flex; align-items: center; justify-content: center;">
        <div style="width: 40px; height: 3px; border-radius: 2px;"></div>
    </div>
</div>

<script id="timeline-script">
    // Timeline functionality - inline for self-contained HTML
    (function () {
        let timeline = null;
        let items = null;
        let itemsDataSet = null;
        let groups = null;
        let isTimelineLoaded = false;
        let timelineIdToElement = new Map(); // Map timeline IDs to DOM elements
        let isResizing = false;

        // Message type to group mapping
        const messageTypeGroups = {
            'user': { id: 'user', content: '🤷 User', className: 'timeline-group-user' },
            'assistant': { id: 'assistant', content: '🤖 Assistant', className: 'timeline-group-assistant' },
            'tool_use': { id: 'tool_use', content: '🛠️ Tool Use', className: 'timeline-group-tool_use' },
            'tool_result': { id: 'tool_result', content: '🧰 Tool Result', className: 'timeline-group-tool_result' },
            'thinking': { id: 'thinking', content: '💭 Thinking', className: 'timeline-group-thinking' },
            'system': { id: 'system', content: '⚙️ System', className: 'timeline-group-system' },
            'image': { id: 'image', content: '🖼️ Image', className: 'timeline-group-image' },
            'sidechain': { id: 'sidechain', content: '🔗 Sub-assistant', className: 'timeline-group-sidechain' },
            'memory': { id: 'memory', content: '🧠 Memory', className: 'timeline-group-memory' },
            'slash-command': { id: 'slash-command', content: '⌨️ Slash Command', className: 'timeline-group-slash-command' },
            'command-output': { id: 'command-output', content: '📋 Command Output', className: 'timeline-group-command-output' },
            'bash-input': { id: 'bash-input', content: '💻 Bash Input', className: 'timeline-group-bash-input' },
            'bash-output': { id: 'bash-output', content: '📄 Bash Output', className: 'timeline-group-bash-output' },
            'teammate': { id: 'teammate', content: '👥 Teammate', className: 'timeline-group-teammate' },
            'task-notification': { id: 'task-notification', content: '🔄 Async result', className: 'timeline-group-task-notification' },
            'workflow_phase': { id: 'workflow_phase', content: '🧩 Workflow Phase', className: 'timeline-group-workflow_phase' },
            'workflow_agent': { id: 'workflow_agent', content: '🤖 Workflow Agent', className: 'timeline-group-workflow_agent' }
        };

        // Build timeline data from messages
        function buildTimelineData() {
            let latestTimeString = '1970-01-01 00:00:00';
            const timelineItems = [];
            const timelineGroups = [];
            const usedGroups = new Set();

            // Clear existing mapping
            timelineIdToElement.clear();

            // Item label and tooltip are built from the card's readable text
            // (#319): what a reader sees with every fold open, never the
            // card's markup. Copying the HTML carried its controls along —
            // the tooltip showed escaped <button> source and a summary-less
            // "▶ Details" stub — and any new button would do it again. So the
            // rules are structural, not a list of known chrome:
            //   - controls contribute nothing, except a disclosure button
            //     (aria-expanded), whose text names the content it folds — so
            //     a text-bearing aria-expanded button inside .content adds its
            //     text by design (today only the JSON param-key toggles);
            //   - display:none subtrees are skipped (e.g. the inactive view
            //     of a user message's Markdown/raw pair);
            //   - <details> count as open: inside a closed one, the fold (not
            //     `display`, which its CSS sets to hide the body) decides;
            //     the <summary> is a preview of that body, so it is dropped;
            //   - blocks and table rows become lines, nested tables indent,
            //     <pre> keeps its whitespace.
            // Collection stops at `limit` characters: emit() caps every
            // write, a <pre> text node is read line by line only up to the
            // cap, and no step re-scans what was already collected.
            const BLOCK_TAGS = new Set([
                'ADDRESS', 'ARTICLE', 'ASIDE', 'BLOCKQUOTE', 'DD', 'DETAILS', 'DIV', 'DL', 'DT',
                'FIELDSET', 'FIGCAPTION', 'FIGURE', 'FOOTER', 'FORM', 'H1', 'H2', 'H3', 'H4', 'H5',
                'H6', 'HEADER', 'HR', 'LI', 'MAIN', 'NAV', 'OL', 'P', 'PRE', 'SECTION', 'TABLE',
                'TR', 'UL'
            ]);
            const SKIPPED_TAGS = new Set([
                'SUMMARY', 'INPUT', 'SELECT', 'TEXTAREA', 'SCRIPT', 'STYLE', 'TEMPLATE'
            ]);

            function readableText(rootEl, limit) {
                let out = '';
                let lineStart = true;
                let indent = 0;
                // Drop trailing spaces by looking at the tail only
                const trimTrailingSpaces = () => {
                    let end = out.length;
                    while (end > 0 && out[end - 1] === ' ') end--;
                    if (end < out.length) out = out.substring(0, end);
                };
                const newLine = () => {
                    trimTrailingSpaces();
                    out += '\n';
                    lineStart = true;
                };
                const breakLine = () => {
                    if (!lineStart) newLine();
                };
                const emit = (text) => {
                    if (!text || out.length >= limit) return;
                    if (lineStart) {
                        out += '  '.repeat(indent);
                        lineStart = false;
                    }
                    out += text.length > limit - out.length ? text.substring(0, limit - out.length) : text;
                };
                const walk = (node, inPre, inClosedFold) => {
                    if (out.length >= limit) return;
                    if (node.nodeType === Node.TEXT_NODE) {
                        const value = node.nodeValue;
                        if (inPre) {
                            // Every newline counts in a <pre>, blank lines
                            // included; stop at the cap, not at the node's end.
                            let start = 0;
                            while (out.length < limit) {
                                const nl = value.indexOf('\n', start);
                                const end = nl === -1 ? value.length : nl;
                                emit(value.substring(start, Math.min(end, start + limit)));
                                if (nl === -1) break;
                                newLine();
                                start = nl + 1;
                            }
                        } else {
                            let text = value.replace(/\s+/g, ' ');
                            if (lineStart || out.endsWith(' ')) text = text.replace(/^ /, '');
                            emit(text);
                        }
                        return;
                    }
                    if (node.nodeType !== Node.ELEMENT_NODE) return;
                    const tag = node.tagName;
                    if (SKIPPED_TAGS.has(tag)) return;
                    if (tag === 'BUTTON' && !node.hasAttribute('aria-expanded')) return;
                    if (!inClosedFold && getComputedStyle(node).display === 'none') return;
                    if (tag === 'BR') {
                        breakLine();
                        return;
                    }
                    if (tag === 'IMG') {
                        emit('[image]');
                        return;
                    }
                    const isBlock = BLOCK_TAGS.has(tag);
                    const nestedTable = tag === 'TABLE' && node.parentElement !== null &&
                        rootEl.contains(node.parentElement.closest('table'));
                    if (isBlock) breakLine();
                    if (nestedTable) indent++;
                    if (tag === 'LI') emit('• ');
                    if ((tag === 'TD' || tag === 'TH') && node.previousElementSibling && !lineStart) {
                        trimTrailingSpaces();
                        out += '  ';
                    }
                    const closedFold = inClosedFold || (tag === 'DETAILS' && !node.open);
                    node.childNodes.forEach(child => walk(child, inPre || tag === 'PRE', closedFold));
                    if (nestedTable) indent--;
                    if (isBlock) breakLine();
                };
                walk(rootEl, false, false);
                return out.replace(/\n{3,}/g, '\n\n').trim();
            }

            function escapeHtml(text) {
                return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            const TOOLTIP_MAX_CHARS = 1200;
            const TOOLTIP_MAX_LINES = 25;

            // Get all messages from the page (including filtered ones - we'll hide them with CSS)
            const messages = document.querySelectorAll('.message:not(.session-header)');

            messages.forEach((messageEl, index) => {
                // Extract message data - handle both simple and complex CSS classes
                const classList = Array.from(messageEl.classList);
                let messageType = 'system'; // Default fallback

                // Auto-memory interactions (Read/Write/Edit on a memory/ path,
                // #192) are a primary, independent dimension: checked BEFORE
                // sidechain so a memory interaction inside a sidechain still
                // lands in the 🧠 Memory lane (governed by the 'memory' toggle),
                // rather than being clobbered into the sidechain lane. Kept in
                // lockstep with applyFilter, which treats 'memory' the same way.
                if (classList.includes('memory')) {
                    messageType = 'memory';
                } else if (classList.includes('sidechain')) {
                    messageType = 'sidechain';
                } else if (classList.some(c => c.startsWith('system-'))) {
                    // Drift-proof: any `system-*` modifier (system-info,
                    // system-warning, system-error, system-away-summary, …)
                    // funnels into the timeline's `system` row, so a new
                    // SystemMessage subclass added by renderer.py /
                    // CSS_CLASS_REGISTRY shows up automatically without
                    // touching this enumeration.
                    messageType = 'system';
                } else if (classList.includes('slash-command')) {
                    messageType = 'slash-command';
                } else if (classList.includes('command-output')) {
                    messageType = 'command-output';
                } else if (classList.includes('bash-input')) {
                    messageType = 'bash-input';
                } else if (classList.includes('bash-output')) {
                    messageType = 'bash-output';
                } else if (classList.includes('teammate')) {
                    // Must precede the generic `.find` below: a teammate
                    // message also carries the `user` class (for styling),
                    // and .find would return `user` first in DOM order.
                    messageType = 'teammate';
                } else if (classList.includes('task-notification')) {
                    // Same pattern as `teammate`: async-agent
                    // <task-notification> entries carry both `user` and
                    // `task-notification` classes — without this branch
                    // they'd land in the `user` group rather than getting
                    // their own 🔄 Async result row in the timeline.
                    messageType = 'task-notification';
                } else if (classList.includes('workflow_phase')) {
                    // Spliced dynamic-workflow phase/agent cards (#174 PR3)
                    // carry the `tool_use` class for filter visibility, so —
                    // like `teammate`/`task-notification` — they need an
                    // explicit branch before the generic `.find` below, else
                    // they'd be swept into the 🛠️ Tool Use lane.
                    messageType = 'workflow_phase';
                } else if (classList.includes('workflow_agent')) {
                    messageType = 'workflow_agent';
                } else {
                    // Look for standard message types
                    messageType = classList.find(cls =>
                        ['user', 'assistant', 'tool_use', 'tool_result', 'thinking', 'system', 'image'].includes(cls)
                    ) ?? 'system';
                }

                const timestampEl = messageEl.querySelector('.timestamp');
                if (!timestampEl) return; // Skip if no timestamp

                // Use raw timestamp from data attribute if available, otherwise fall back to text content
                const rawTimestamp = timestampEl.getAttribute('data-timestamp');
                const timestamp = rawTimestamp ?? timestampEl.textContent.trim();
                if (timestamp > latestTimeString) latestTimeString = timestamp;

                // Get message content preview
                const contentEl = messageEl.querySelector('.content');
                const readable = contentEl ? readableText(contentEl, TOOLTIP_MAX_CHARS + 1) : '';
                let content = '';
                if (contentEl) {
                    let textContent = readable.replace(/\s+/g, ' ');

                    // For system messages, try to extract just the message without the prefix
                    if (messageType === 'system') {
                        // System messages often have format like "⚠️ System Warning: message content"
                        const systemMatch = textContent.match(/^[⚠️❌ℹ️]?\s*System\s+\w+:\s*(.+)$/);
                        if (systemMatch) {
                            textContent = systemMatch[1];
                        }
                    }

                    content = textContent.length > 100 ? textContent.substring(0, 100) + '...' : textContent;
                }

                // For tool_use messages, try to extract the tool name
                if (messageType === 'tool_use') {
                    // Try to extract tool name from JSON content
                    const nameMatch = content.match(/"name":\s*"([^"]+)"/);
                    if (nameMatch) {
                        const toolName = nameMatch[1];
                        content = toolName + ': ' + content.replace(/"name":\s*"[^"]+",?\s*/, '');
                    } else {
                        // Fallback: try to extract from header if available
                        const headerEl = messageEl.querySelector('.header span');
                        if (headerEl) {
                            const headerText = headerEl.textContent ?? '';
                            const toolMatch = headerText.match(/🛠️\s*(.+) \(Id:.*/);
                            if (toolMatch) {
                                content = toolMatch[1].replace("Tool Use: ", "") + (content ? ': ' + content : '');
                            }
                        }
                    }
                }

                // Add group if not already added
                if (!usedGroups.has(messageType)) {
                    timelineGroups.push(messageTypeGroups[messageType]);
                    usedGroups.add(messageType);
                }

                // Store mapping for click handling
                timelineIdToElement.set(index, messageEl);

                // Tooltip: the readable text, truncated, escaped into a <pre>;
                // plus the first image, which text cannot show.
                let tooltipText = readable.split('\n').slice(0, TOOLTIP_MAX_LINES).join('\n');
                if (tooltipText.length > TOOLTIP_MAX_CHARS) {
                    tooltipText = tooltipText.substring(0, TOOLTIP_MAX_CHARS);
                }
                if (tooltipText.length < readable.length) tooltipText = tooltipText.trimEnd() + ' …';
                let title = tooltipText ? `<pre>${escapeHtml(tooltipText)}</pre>` : '';
                const imageEl = contentEl ? contentEl.querySelector('img') : null;
                if (imageEl && imageEl.getAttribute('src')) {
                    title += `<img src="${escapeHtml(imageEl.getAttribute('src'))}" alt="">`;
                }

                // Adjust content display based on message type
                let displayContent = content ?? messageTypeGroups[messageType].content;

                // Check for sidechain context regardless of primary message type
                // Note: Sidechain user messages (Sub-assistant prompts) are now skipped
                // since they duplicate the Task tool input prompt.
                // Exclude memory messages: memory is the higher-priority primary
                // dimension (#192), so a memory-in-sidechain interaction stays in
                // the 🧠 Memory lane instead of being overridden to sidechain.
                if (classList.includes('sidechain') && !classList.includes('memory')) {
                    // Override group for sidechain messages, but preserve the content
                    messageType = 'sidechain';

                    // For sidechain messages, prefix with appropriate icon based on original type
                    if (classList.includes('assistant')) {
                        displayContent = '🔗 ' + (content ?? 'Sub-assistant response');
                    } else if (classList.includes('tool_use')) {
                        displayContent = '🔗 ' + (content ?? 'Sub-assistant tool use');
                    } else if (classList.includes('tool_result')) {
                        displayContent = '🔗 ' + (content ?? 'Sub-assistant tool result');
                    } else {
                        displayContent = '🔗 ' + (content ?? 'Sub-assistant');
                    }
                }

                // Create timeline item
                const timelineItem = {
                    id: index,
                    // vis renders the label as HTML: the text must not become markup
                    content: escapeHtml(displayContent),
                    start: timestamp,
                    group: messageType,
                    title,
                    className: `timeline-item-${messageType}`
                };

                timelineItems.push(timelineItem);
            });

            // Set timeline window to show last hour by default, with padding after the last message
            const timelineEnd = new Date(new Date(latestTimeString).getTime() + 60 * 60 * 1000); // 1 hour after latest
            const timelineStart = new Date(timelineEnd.getTime() - 2 * 60 * 60 * 1000); // 2 hours total window (1 hour before latest + 1 hour after)

            return { timelineItems, timelineGroups, timelineEnd, timelineStart };
        }

        // The timeline groups a filter toggle governs. Mirrors the toggle
        // expansion in the transcript's applyFilter: the single "Tool" toggle
        // stands for both tool groups, and "User" also covers the
        // user-initiated bash lines. Every other toggle governs the group of
        // its own name.
        const TOGGLE_GROUPS = {
            'tool': ['tool_use', 'tool_result'],
            'user': ['user', 'bash-input', 'bash-output']
        };
        function groupsOfToggle(type) {
            return TOGGLE_GROUPS[type] || [type];
        }

        // Filter timeline items based on current message filters
        function applyFilters() {
            if (!timeline || !groups) return;

            // Groups each active toggle shows, and every group some toggle governs
            const activeGroups = Array.from(document.querySelectorAll('.filter-toggle.active'))
                .flatMap(toggle => groupsOfToggle(toggle.dataset.type));
            const governedGroups = Array.from(document.querySelectorAll('.filter-toggle'))
                .flatMap(toggle => groupsOfToggle(toggle.dataset.type));

            // Update groups visibility based on filter states
            // Groups with filter toggles follow toggle state; groups without toggles stay visible
            const updatedGroups = groups.map(group => ({
                ...group,
                visible: governedGroups.includes(group.id) ? activeGroups.includes(group.id) : true
            }));

            // Update timeline groups
            timeline.setGroups(updatedGroups);
            // A group a toggle doesn't govern on its own (async results,
            // teammates, a sub-assistant's tool calls…) can still hold items
            // whose card the filter hid: hide those items one by one.
            applySearchFilter();
        }

        // Hide/show individual timeline items to mirror the transcript: the
        // search component tags non-matching messages with .search-hidden and
        // the filter tags hidden types with .filtered-hidden. Group-level
        // type filtering above can't express per-item state, so this toggles
        // the timeline-filtered-hidden class on each item.
        function applySearchFilter() {
            if (!timeline || !itemsDataSet) return;

            const updates = [];
            timelineIdToElement.forEach((messageEl, id) => {
                const item = itemsDataSet.get(id);
                if (!item) return;

                const hidden = messageEl.classList.contains('search-hidden')
                    || messageEl.classList.contains('filtered-hidden');
                const baseClassName = (item.className || '')
                    .split(/\s+/)
                    .filter(cls => cls && cls !== 'timeline-filtered-hidden')
                    .join(' ');
                const className = hidden
                    ? baseClassName + ' timeline-filtered-hidden'
                    : baseClassName;

                if (className !== item.className) {
                    updates.push({ id, className });
                }
            });

            if (updates.length > 0) {
                itemsDataSet.update(updates);
            }
        }

        // Handle timeline item click - scroll to corresponding message
        function onTimelineSelect(event) {
            const selection = timeline.getSelection();
            if (selection.length > 0) {
                const itemId = selection[0];
                const messageEl = timelineIdToElement.get(itemId);
                if (messageEl) {{ '{' }}{% if minimal %}
                    // Minimal theme: unfold the card's ancestors and open the
                    // branch lane holding it (the DAG engine wraps this hook)
                    // before measuring where to scroll.
                    if (window.claudeLogRevealMessage) window.claudeLogRevealMessage(messageEl);{% endif %}
                    // Calculate timeline height for proper scroll positioning
                    const timelineContainer = document.getElementById('timeline-container');
                    const timelineHeight = timelineContainer ? timelineContainer.offsetHeight : 0;

                    // Scroll so message top aligns with timeline bottom
                    const elementTop = messageEl.getBoundingClientRect().top + window.scrollY;
                    const scrollPosition = elementTop - timelineHeight - 10; // 10px padding

                    window.scrollTo({
                        top: Math.max(0, scrollPosition),
                        behavior: 'smooth'
                    });

                    // Highlight the message briefly
                    messageEl.classList.add('timeline-flash');
                    setTimeout(() => {
                        messageEl.classList.remove('timeline-flash');
                    }, 2000);
                }
            }
        }

        // Initialize timeline
        function initTimeline() {
            if (timeline) return; // Already initialized

            console.log('Initializing vis-timeline...');

            const container = document.getElementById('timeline-visualization');
            if (!container) {
                console.error('Timeline container not found');
                return;
            }

            // Build timeline data
            const { timelineItems, timelineGroups, timelineEnd, timelineStart } = buildTimelineData();
            items = timelineItems
            groups = timelineGroups
            if (items.length === 0) {
                console.warn('No timeline items found');
                return;
            }

            // Timeline options
            const options = {
                height: '100%',
                stack: true,
                showCurrentTime: true,
                zoomMin: 1000 * 1, // 1 second
                zoomMax: 1000 * 60 * 60 * 24 * 30, // 30 days
                start: timelineStart,
                end: timelineEnd,
                orientation: 'top',
                align: 'left',
                tooltip: {
                    // FIXME: This followMouse doesn't work for some reason and the tooltip box gets cut off for the bottom timeline boxes
                    followMouse: true,
                    overflowMethod: 'cap'
                },
                margin: {
                    item: 2,
                    axis: 2
                },
                groupOrder: (a, b) => {
                    const order = ['user', 'teammate', 'task-notification', 'system', 'slash-command', 'command-output', 'bash-input', 'bash-output', 'thinking', 'assistant', 'sidechain', 'memory', 'tool_use', 'tool_result', 'image'];
                    return order.indexOf(a.id) - order.indexOf(b.id);
                }
            };

            // Create timeline
            itemsDataSet = new vis.DataSet(items);
            timeline = new vis.Timeline(container, itemsDataSet, new vis.DataSet(groups), options);

            // Make timeline available globally for debugging
            window.timeline = timeline;

            // Add event listeners
            timeline.on('select', onTimelineSelect);

            // Apply current filters (type toggles + any active search)
            applyFilters();
            applySearchFilter();

            console.log('Timeline initialized with', items.length, 'items and', groups.length, 'groups');
        }

        // Load vis-timeline library dynamically
        function loadVisTimeline() {
            return new Promise((resolve, reject) => {
                if (window.vis && window.vis.Timeline) {
                    resolve();
                    return;
                }

                console.log('Loading vis-timeline from CDN...');

                // Load CSS first
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = 'https://unpkg.com/vis-timeline/styles/vis-timeline-graph2d.min.css';
                document.head.appendChild(link);

                // Load JavaScript
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/vis-timeline/standalone/umd/vis-timeline-graph2d.min.js';
                script.onload = () => {
                    console.log('vis-timeline loaded successfully');
                    isTimelineLoaded = true;
                    resolve();
                };
                script.onerror = () => {
                    console.error('Failed to load vis-timeline');
                    reject(new Error('Failed to load vis-timeline'));
                };
                document.head.appendChild(script);
            });
        }

        // Toggle timeline visibility
        function toggleTimeline() {
            const container = document.getElementById('timeline-container');
            const button = document.getElementById('toggleTimeline');

            if (container.style.display === 'none') {
                // Show timeline
                button.classList.add('active');
                button.title = 'Hide timeline';
                button.textContent = '🗓️';

                // Load vis-timeline if needed and show timeline
                loadVisTimeline().then(() => {
                    container.style.display = 'block';
                    // Set default height if not already set
                    if (!container.style.height) {
                        container.style.height = '30vh';
                    }
                    // Wait for container to be visible, then initialize
                    setTimeout(() => {
                        initTimeline();
                        initTimelineResize();
                    }, 100);
                }).catch(error => {
                    console.error('Error loading timeline:', error);
                    alert('Failed to load timeline. Please check your internet connection.');
                    container.style.display = 'none';
                    button.classList.remove('active');
                    button.title = 'Show timeline';
                    button.textContent = '📆';
                });
            } else {
                // Hide timeline
                container.style.display = 'none';
                button.classList.remove('active');
                button.title = 'Show timeline';
                button.textContent = '📆';
            }
        }

        // Update timeline position when filter bar is toggled
        function updateTimelinePosition() {
            const container = document.getElementById('timeline-container');
            const filterToolbar = document.querySelector('.filter-toolbar');

            if (container && filterToolbar) {
                const filterHeight = filterToolbar.offsetHeight;
                const computedStyle = getComputedStyle(filterToolbar);
                const isFilterVisible = computedStyle.display !== 'none' &&
                    computedStyle.visibility !== 'hidden' &&
                    filterHeight > 0;

                container.style.top = isFilterVisible ? `${filterHeight}px` : '0px';
            }
        }

        // Initialize timeline resizing functionality
        function initTimelineResize() {
            const container = document.getElementById('timeline-container');
            const resizeHandle = document.getElementById('timeline-resize-handle');

            if (!container || !resizeHandle) return;

            let startY = 0;
            let startHeight = 0;

            function handleMouseDown(e) {
                isResizing = true;
                startY = e.clientY;
                startHeight = container.offsetHeight;

                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);

                // Prevent text selection during resize
                document.body.style.userSelect = 'none';
                e.preventDefault();
            }

            function handleMouseMove(e) {
                if (!isResizing) return;

                const deltaY = e.clientY - startY;
                const newHeight = Math.max(150, Math.min(window.innerHeight * 0.8, startHeight + deltaY));

                container.style.height = newHeight + 'px';

                // Trigger timeline redraw if needed
                if (timeline) {
                    timeline.redraw();
                }
            }

            function handleMouseUp() {
                isResizing = false;
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleMouseUp);
                document.body.style.userSelect = '';
            }

            // Add mouse event listeners
            resizeHandle.addEventListener('mousedown', handleMouseDown);

            // Also allow resizing by dragging the container bottom edge
            container.addEventListener('mousedown', function (e) {
                const rect = container.getBoundingClientRect();
                if (e.clientY >= rect.bottom - 8) {
                    handleMouseDown(e);
                }
            });
        }

        // Rebuild from the current DOM after a live update swapped the
        // transcript. The timeline reads message types out of CSS classes,
        // so new cards are invisible to it until this runs.
        //
        // A timeline that was never opened needs nothing: it is built
        // lazily, and will read the new DOM when it is.
        function rebuildTimeline() {
            if (!timeline || !itemsDataSet) return;
            const { timelineItems, timelineGroups } = buildTimelineData();
            items = timelineItems;
            groups = timelineGroups;
            // Replace the contents rather than the DataSet so the user's
            // current zoom/pan window survives the update.
            itemsDataSet.clear();
            itemsDataSet.add(items);
            timeline.setGroups(new vis.DataSet(groups));
            applyFilters();
            applySearchFilter();
        }

        // The rehydrate contract passes a subtree, and calls the hooks once
        // per changed element — which is what the other two hooks want,
        // since they only touch what they are given. This one is the
        // exception: it reads the whole document, so a patch touching a
        // dozen cards would mean a dozen whole-page rebuilds, per poll, of
        // exactly the work the patch path exists to avoid. Collapse a
        // burst into one rebuild after the current task instead.
        let rebuildScheduled = false;
        function scheduleRebuild() {
            if (!timeline || !itemsDataSet) return;  // never opened: nothing to do
            if (rebuildScheduled) return;
            rebuildScheduled = true;
            const run = function () {
                rebuildScheduled = false;
                rebuildTimeline();
            };
            if (window.queueMicrotask) window.queueMicrotask(run);
            else setTimeout(run, 0);
        }

        // Export functions to global scope
        window.rebuildTimeline = rebuildTimeline;
        if (window.claudeLogOnRehydrate) {
            window.claudeLogOnRehydrate(scheduleRebuild);
        }
        window.toggleTimeline = toggleTimeline;
        window.applyTimelineFilters = applyFilters;
        window.applyTimelineSearchFilter = applySearchFilter;
        window.updateTimelinePosition = updateTimelinePosition;

        // Hook into existing systems
        document.addEventListener('DOMContentLoaded', function () {
            // Listen for filter changes
            const filterToggles = document.querySelectorAll('.filter-toggle');
            filterToggles.forEach(toggle => {
                toggle.addEventListener('click', function () {
                    setTimeout(applyFilters, 50);
                });
            });

            // Listen for select all/none buttons
            const selectAllButton = document.getElementById('selectAll');
            const selectNoneButton = document.getElementById('selectNone');
            if (selectAllButton) {
                selectAllButton.addEventListener('click', function () {
                    setTimeout(applyFilters, 50);
                });
            }
            if (selectNoneButton) {
                selectNoneButton.addEventListener('click', function () {
                    setTimeout(applyFilters, 50);
                });
            }

            // Listen for filter toolbar visibility changes
            const filterButton = document.getElementById('filterMessages');
            const closeFiltersButton = document.getElementById('closeFilters');

            if (filterButton) {
                filterButton.addEventListener('click', function () {
                    setTimeout(updateTimelinePosition, 50);
                });
            }

            if (closeFiltersButton) {
                closeFiltersButton.addEventListener('click', function () {
                    setTimeout(updateTimelinePosition, 50);
                });
            }

            // Update timeline position on window resize
            window.addEventListener('resize', updateTimelinePosition);
        });
    })();
</script>
