    vis.forEach((m) => {
      const key = colOf[m.lane] !== undefined ? m.lane : 'main';
      let r = Math.max(prev, nextFree[key] || 0);
      const L = LANES[m.lane];
      if (L.from && rowOf[L.from] !== undefined) r = Math.max(r, rowOf[L.from] + 1);
      const merging = BRANCHES.find((b) => LANES[b].merge === m.id);
      if (merging && lastRowOf[merging] !== undefined) r = Math.max(r, lastRowOf[merging] + 1);
      rowOf[m.id] = r;
      lastRowOf[m.lane] = r;
      nextFree[key] = r + 1;
      prev = r;
    });
    const nRows = prev + 1;
    const base = hasCols ? 2 : 1;

    // Rail: one row of lane slots per grid row, drawn like a git graph.
    const railed = BRANCHES.filter((l) => mode(l) === 'shut' || mode(l) === 'inline');
    const rowsOfLane = {};
    vis.forEach((m) => {
      if (m.lane !== 'main' && colOf[m.lane] !== undefined) return;
      rowsOfLane[m.lane] = rowsOfLane[m.lane] || {};
      rowsOfLane[m.lane][rowOf[m.id]] = m.kind;
    });
    const mainRows = Object.keys(rowsOfLane.main).map(Number);
    const mainFirst = Math.min.apply(null, mainRows);
    const mainLast = Math.max.apply(null, mainRows);
    const span = {};
    railed.forEach((l) => {
      const L = LANES[l];
      const from = rowOf[L.from];
      let end = from;
      if (L.merge) end = rowOf[L.merge];
      else if (mode(l) === 'inline') end = Math.max.apply(null, Object.keys(rowsOfLane[l] || {}).map(Number).concat([from]));
      span[l] = { from: from, end: end };
    });
    const rail = [];
    for (let r = 0; r < nRows; r++) {
      const sl = [0, 1, 2].map(() => ({ ln: '', hl: '', v: '', h: '', kind: '' }));
      if (r >= mainFirst && r <= mainLast) {
        sl[0].ln = 'main';
        const k = rowsOfLane.main[r];
        if (k) {
          sl[0].kind = k;
          sl[0].v = (r > mainFirst ? 'vt' : '') + (r < mainLast ? ' vb' : '');
        } else sl[0].v = 'v';
      }
      railed.forEach((l) => {
        const sp = span[l];
        if (r < sp.from || r > sp.end) return;
        const L = LANES[l];
        const x = sl[L.slot];
        x.ln = l;
        const connect = () => {
          sl[0].h = 'r';
          sl[0].hl = l;
          for (let k = 1; k < L.slot; k++) { sl[k].h = 'h'; sl[k].hl = l; }
          x.hl = l;
        };
        if (r === sp.from) { x.v = sp.end > sp.from ? 'cd' : 'cd stub'; connect(); }
        else if (r === sp.end && L.merge) { x.v = 'cu'; connect(); }
        else if (rowsOfLane[l] && rowsOfLane[l][r]) { x.kind = rowsOfLane[l][r]; x.v = 'vt' + (r < sp.end ? ' vb' : ''); }
        else x.v = 'v' + (mode(l) === 'shut' ? ' dash' : '');
      });
      rail.push({
        gr: r + base,
        slots: sl.map((x) => ({ cls: ['sl', x.ln && 'ln-' + x.ln, x.hl && 'hl-' + x.hl, x.v, x.h, x.kind && 'dot k-' + x.kind].filter(Boolean).join(' ') }))
      });
    }

    const ctlFor = (l) => {
      const md = mode(l);
      const L = LANES[l];
      const inCol = md === 'col' || md === 'strip';
      const suffix = md === 'inline' ? ' · interleaved' : inCol ? ' · in column →' : '';
      return {
        cls: 'bctl ln-' + l + (md === 'inline' ? ' is-open' : ''),
        ex: md === 'inline' ? 'true' : 'false',
        label: (L.ctlName ? L.ctlName + ' · ' : '') + L.stats + suffix,
        toggle: () => this.setMode(l, md === 'shut' ? 'inline' : 'shut'),
        colLabel: inCol ? '⇤ Interleave' : 'Column ⇥',
        col: () => this.setMode(l, inCol ? 'inline' : 'col')
      };
    };

    const items = vis.map((m) => {
      const inCol = colOf[m.lane] !== undefined && m.lane !== 'main';
      const open = !!s.open[m.id];
      const R = rowOf[m.id] + base;
      const tg = () => this.setState((st) => {
        const o = Object.assign({}, st.open);
        o[m.id] = !o[m.id];
        return { open: o };
      });
      return {
        lane: m.lane, t: m.t, role: m.role, call: m.call || '', dim: m.dim || '', text: m.text || '', tok: m.tok || '',
        tagLbl: m.lane !== 'main' && !inCol ? LANES[m.lane].tag : '',
        kcls: 'k-' + m.kind,
        wcls: inCol ? 'w-col ln-' + m.lane : 'w-main',
        wr: inCol ? R : 'auto', wc: inCol ? 4 + colOf[m.lane] : 'auto',
        gr: inCol ? 1 : R, gc: 1,
        mr: inCol ? 1 : R, mc: inCol ? 2 : 3,
        mcls: (inCol ? 'cm' : 'c3') + ' k-' + m.kind + ' in-' + m.lane,
        tclip: 'tx' + (m.tmore ? ' clip prose' + (open ? ' is-open' : '') : ''),
        tmore: m.tmore || 0, tmoreLbl: m.tmore ? '+ ' + m.tmore + (m.tmore > 1 ? ' lines' : ' line') : '',
        lines: m.pre ? m.pre.split('\n').map((x) => ({ s: x, c: m.diff ? (x[0] === '+' ? 'add' : x[0] === '-' ? 'del' : '') : '' })) : null,
        pclip: m.more ? 'clip' + (open ? ' is-open' : '') : '',
        more: m.more || 0, moreLbl: m.more ? '+ ' + m.more + ' lines' : '',
        ex: open ? 'true' : 'false', tg: tg,
        ctl: m.ctl ? ctlFor(m.ctl) : null
      };
    });

    const cols = colLanes.map((l, i) => {
      const md = mode(l);
      const L = LANES[l];
      return {
        gc: 4 + i, span: nRows + 1, name: L.name, meta: L.meta + ' · ' + L.stats,
        bgcls: 'colbg ln-' + l, hcls: 'colhead ln-' + l,
        strip: md === 'strip', full: md === 'col',
        collapse: () => this.setMode(l, 'strip'),
        expand: () => this.setMode(l, 'col'),
        inline: () => this.setMode(l, 'inline')
      };
    });
    const gtc = '64px 48px minmax(360px, 1fr)' + colLanes.map((l) => (mode(l) === 'strip' ? ' 34px' : ' minmax(300px, 1fr)')).join('');

    const bm = {}, bmP = {}, setAll = {};
    ['shut', 'inline', 'col'].forEach((md) => {
      const all = BRANCHES.every((l) => mode(l) === md);
      bm[md] = all ? 'on' : '';
      bmP[md] = all ? 'true' : 'false';
      setAll[md] = () => this.setState({ modes: { A: md, B: md, F: md } });
    });
    const th = {}, thP = {}, setTheme = {};
    ['auto', 'light', 'dark'].forEach((t) => {
      th[t] = s.theme === t ? 'on' : '';
      thP[t] = s.theme === t ? 'true' : 'false';
      setTheme[t] = () => this.setState({ theme: t });
    });
    const dark = s.theme === 'dark' || (s.theme === 'auto' && s.osDark);
    return {
      fs: this.props.fs ?? 14,
      appCls: 'app ' + (dark ? 'dark' : 'light'),
      wrapCls: 'wrap' + (hasCols ? ' wide' : ''),
      hasCols: hasCols, gtc: gtc, cols: cols, rail: rail, items: items,
      bm: bm, bmP: bmP, setAll: setAll,
      th: th, thP: thP, setTheme: setTheme
    };
  }
}
</script>
</body>
</html>
